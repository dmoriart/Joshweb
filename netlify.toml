[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20.11.0"

[dev]
  command   = "npm run dev"
  port      = 8888

# Single-page app fallback. Netlify serves any matching static file first, so
# /sitemap.xml, /robots.txt and /images/* are unaffected; everything else is
# handed to the React router instead of 404ing. Required before real routes
# are introduced, otherwise deep links and page refreshes break.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed filenames here, so these can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Artwork filenames are NOT hashed — Josh may replace a file in place. A week
# of caching with background revalidation keeps repeat visits fast without
# stranding anyone on an old image for a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
