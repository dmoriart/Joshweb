<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Was a 4.7 MB photo served as the favicon on every page load. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!--
    Preloaded because the @font-face lives inside the bundled stylesheet, so the
    browser would otherwise only discover the font after fetching and parsing
    that CSS. crossorigin is required even same-origin: fonts are always fetched
    in CORS mode, and without it the preload is discarded and fetched twice.
  -->
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <!--
    Per-route title, description, canonical and Open Graph values are set by
    src/components/PageMeta.jsx. The values below are the home-page defaults
    and what a crawler sees before any JavaScript runs.
  -->
  <title>Josh Moriarty | Comic Artist, 2D Animator and Filmmaker</title>
  <meta name="description"
    content="Portfolio of Irish comic artist, 2D animator and filmmaker Josh Moriarty, featuring illustration, sequential art, animation and film work." />
  <meta name="author" content="Josh Moriarty" />
  <meta name="robots" content="index, follow" />
  <meta name="google-site-verification" content="J6yplOO95iZjh_IBiG0hXRcdgGXQ9gZ9JKggET_2Qb8" />
  <link rel="canonical" href="https://joshmoriartyfilms.ie/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://joshmoriartyfilms.ie/" />
  <meta property="og:title" content="Josh Moriarty | Comic Artist, 2D Animator and Filmmaker" />
  <meta property="og:description"
    content="Portfolio of Irish comic artist, 2D animator and filmmaker Josh Moriarty, featuring illustration, sequential art, animation and film work." />
  <meta property="og:image" content="https://joshmoriartyfilms.ie/share-card.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Josh Moriarty" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Josh Moriarty | Comic Artist, 2D Animator and Filmmaker" />
  <meta name="twitter:description"
    content="Portfolio of Irish comic artist, 2D animator and filmmaker Josh Moriarty, featuring illustration, sequential art, animation and film work." />
  <meta name="twitter:image" content="https://joshmoriartyfilms.ie/share-card.jpg" />
  <meta name="twitter:creator" content="@joshmoriartyfilms" />

  <meta name="theme-color" content="#0d0d0f" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Josh Moriarty",
      "jobTitle": "Comic Artist, 2D Animator and Filmmaker",
      "url": "https://joshmoriartyfilms.ie",
      "description": "Emerging Irish artist, animator and filmmaker working in comic art, character-driven animation and cinematic storytelling.",
      "nationality": "Irish",
      "address": { "@type": "PostalAddress", "addressCountry": "IE" },
      "knowsAbout": [
        "Comic illustration",
        "Sequential art",
        "2D animation",
        "Animation clean-up",
        "Storyboarding",
        "Character design",
        "Visual development",
        "Filmmaking"
      ],
      "sameAs": [
        "https://www.youtube.com/@joshmoriartyfilms",
        "https://www.instagram.com/joshmoriartyfilms"
      ]
    }
  </script>

  <!-- Cloudflare Web Analytics. The token is a public beacon identifier, not a secret. -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
    data-cf-beacon='{"token": "baf6e175a4a34901ad2f8ee207760b77"}'></script>
</head>

<body>
  <!--
    Hidden form so Netlify can detect the fields at build time. Field names and
    option values must stay in sync with PROJECT_TYPES in ContactForm.jsx.
  -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="project-type">
      <option value="illustration">Illustration / comic art</option>
      <option value="animation">Animation</option>
      <option value="film">Film / video</option>
      <option value="collaboration">Collaboration</option>
      <option value="other">Other</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
